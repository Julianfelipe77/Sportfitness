<!-- FORMULARIO DE RECUPERACIÓN -->

<section class="container mt-5 mb-5">

    <div class="card shadow auth-card">

        <div class="card-body p-4">

            <h2 class="text-center fw-bold mb-2">
                <i class="fa-solid fa-key text-success"></i>
                ¿Olvidaste tu contraseña?
            </h2>

            <p class="text-center text-muted mb-4">
                Escribe el correo con el que te registraste y te enviaremos
                un enlace para crear una nueva contraseña.
            </p>


            <form id="form-recuperar">

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="recuperar-correo" required>
                </div>

                <button type="submit" class="btn btn-success w-100" id="recuperar-boton">
                    Enviar enlace de recuperación
                </button>

            </form>

            <p class="text-center mt-4 mb-0">
                <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Volver a iniciar sesión</a>
            </p>
